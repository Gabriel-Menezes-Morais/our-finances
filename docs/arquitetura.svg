<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura proposta do OUR_FINANCES</title>
  <desc id="desc">Telegram entra no backend próprio. GPT-6 Luna interpreta e ElevenLabs processa áudio. O domínio grava em PostgreSQL. Um worker publica e verifica Excel online e Google Sheets.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
    <style>
      text { font-family: Segoe UI, Arial, sans-serif; fill: #172033; }
      .title { font-size: 25px; font-weight: 700; }
      .label { font-size: 17px; font-weight: 600; }
      .sub { font-size: 13px; fill: #475569; }
      .node { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 10; }
      .external { fill: #f0f7ff; stroke: #376594; stroke-width: 1.5; rx: 10; }
      .flow { fill: none; stroke: #475569; stroke-width: 1.8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1100" height="640" fill="#f8fafc"/>
  <text class="title" x="35" y="43">OUR_FINANCES</text>
  <text class="sub" x="35" y="68">Arquitetura proposta | Excel online como ambiente principal | 01/11/2026</text>
  <rect x="280" y="95" width="480" height="440" fill="#eef2f6" stroke="#94a3b8" stroke-dasharray="7 5" rx="15"/>
  <text class="sub" x="300" y="120">BACKEND PRÓPRIO: AUTORIZAÇÃO, CÁLCULO E AUDITORIA</text>
  <rect class="external" x="35" y="160" width="205" height="85"/>
  <text class="label" x="60" y="192">Telegram</text>
  <text class="sub" x="60" y="216">Texto, voz e ferramentas</text>
  <rect class="node" x="320" y="155" width="400" height="85"/>
  <text class="label" x="345" y="187">Entrada e agente</text>
  <text class="sub" x="345" y="211">Inbox durável e ações tipadas</text>
  <path class="flow" d="M240 198 H310"/>
  <rect class="external" x="805" y="115" width="260" height="78"/>
  <text class="label" x="825" y="145">GPT-6 Luna</text>
  <text class="sub" x="825" y="168">Interpretação e propostas</text>
  <rect class="external" x="805" y="218" width="260" height="78"/>
  <text class="label" x="825" y="248">ElevenLabs</text>
  <text class="sub" x="825" y="271">Transcrição e síntese de voz</text>
  <path class="flow" d="M720 175 H775 V154 H795"/>
  <path class="flow" d="M720 215 H775 V257 H795"/>
  <rect class="node" x="320" y="280" width="400" height="85"/>
  <text class="label" x="345" y="312">Domínio e PostgreSQL</text>
  <text class="sub" x="345" y="336">Finanças, análises, versões e outbox</text>
  <path class="flow" d="M520 240 V270"/>
  <rect class="node" x="320" y="410" width="400" height="85"/>
  <text class="label" x="345" y="442">Worker e reconciliação</text>
  <text class="sub" x="345" y="466">Publicação, agenda e evidência de sync</text>
  <path class="flow" d="M520 365 V400"/>
  <rect class="external" x="805" y="365" width="260" height="78"/>
  <text class="label" x="825" y="395">Excel online</text>
  <text class="sub" x="825" y="418">Office Scripts / Power Automate</text>
  <rect class="external" x="805" y="475" width="260" height="78"/>
  <text class="label" x="825" y="505">Google Sheets</text>
  <text class="sub" x="825" y="528">API, pivôs e gráficos nativos</text>
  <path class="flow" d="M720 435 H775 V404 H795"/>
  <path class="flow" d="M720 475 H775 V514 H795"/>
  <path class="flow" d="M320 455 H137 V255"/>
  <text class="sub" x="35" y="360">Respostas, relatórios</text>
  <text class="sub" x="35" y="380">e estado de atualização</text>
  <text class="sub" x="35" y="593">Interfaces externas retornam resultados e evidências ao componente chamador; setas mostram a direção principal.</text>
  <text class="sub" x="35" y="615">APIs, contas, permissões e custos dependem de acesso fornecido pelo proprietário. Nenhuma integração está ativa.</text>
</svg>
