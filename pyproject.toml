[project]
name = "our-finances"
version = "0.1.0"
description = "Finanças pessoais pelo Telegram com análises em Excel online e Sheets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gabriel Menezes Morais"}]
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3,<4",
    "alembic>=1,<2",
    "cryptography>=45,<50",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "matplotlib>=3.9,<4",
    "openai>=2,<3",
    "openpyxl>=3.1,<4",
    "pillow>=11,<13",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "tzdata>=2025.1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-openpyxl>=3.1",
]

[tool.uv]
package = false

[project.urls]
Repository = "https://github.com/gabriel-menezes-morais/our-finances"
Issues = "https://github.com/gabriel-menezes-morais/our-finances/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: chamadas reais que exigem acesso e autorização explícitos"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
